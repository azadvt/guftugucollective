<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guftugu Collective — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,700&family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@200;300;400;500&family=Noto+Sans+Kannada:wght@300;400&family=Noto+Sans+Devanagari:wght@300;400&family=Noto+Sans+Tamil:wght@300;400&family=Noto+Sans+Malayalam:wght@300;400&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="images/logo.jpeg" type="image/jpeg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="grain"></div>

  <main class="page">

    <nav class="top-bar">
      <div class="social-links">
        <a href="https://www.instagram.com/guftugu_collective/" target="_blank" rel="noopener" aria-label="Instagram">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.5" fill="currentColor" stroke="none"/></svg>
        </a>
        <a href="https://www.youtube.com/@guftugu.collective" target="_blank" rel="noopener" aria-label="YouTube">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22.54 6.42a2.78 2.78 0 00-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 00-1.94 2A29 29 0 001 12a29 29 0 00.46 5.58 2.78 2.78 0 001.94 2C5.12 20 12 20 12 20s6.88 0 8.6-.46a2.78 2.78 0 001.94-2A29 29 0 0023 12a29 29 0 00-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="currentColor" stroke="none"/></svg>
        </a>
      </div>
    </nav>

    <section class="hero">

      <div class="ticker ticker-top">
        <div class="ticker-track" id="tickerTop"></div>
      </div>

      <div class="title-block">
        <h1 class="main-title">guftugu</h1>
        <p class="main-sub">collective</p>
      </div>

      <div class="ticker ticker-bottom">
        <div class="ticker-track reverse" id="tickerBottom"></div>
      </div>

      <div class="middle-info">
        <div class="thin-line"></div>
        <p class="film-society">A Film Society</p>
      </div>

      <div class="launch-section">
        <p class="launching">Launching Soon</p>
        <div class="countdown" id="countdown">
          <div class="countdown-block">
            <span class="countdown-num" id="days">00</span>
            <span class="countdown-label">Days</span>
          </div>
          <div class="countdown-sep"></div>
          <div class="countdown-block">
            <span class="countdown-num" id="hours">00</span>
            <span class="countdown-label">Hours</span>
          </div>
          <div class="countdown-sep"></div>
          <div class="countdown-block">
            <span class="countdown-num" id="minutes">00</span>
            <span class="countdown-label">Min</span>
          </div>
          <div class="countdown-sep"></div>
          <div class="countdown-block">
            <span class="countdown-num" id="seconds">00</span>
            <span class="countdown-label">Sec</span>
          </div>
        </div>
      </div>

    </section>

    <footer class="bottom-bar">
      <span>&copy; 2026 Guftugu Collective. All rights reserved.</span>
    </footer>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
